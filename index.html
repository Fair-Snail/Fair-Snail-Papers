
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Paper</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    iframe {
      width: 100%;
      height: calc(100% - 45px);
      border: none;
    }

    .link {
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="link">
    <a href="./paper.pdf" target="_blank">
      Open or download the paper (PDF)
    </a>
  </div>

  <iframe src="./paper.pdf" title="My paper"></iframe>
</body>
</html>
