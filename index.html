
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PASTE IT HERE -->
  <meta name="google-site-verification" content="b6rHuvk4I4XeUj5JDm_gaM6cee4BtqIacWrkn3TRl8M" />
  <title>Research Paper</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }

    header {
      padding: 20px;
      background: #eee;
    }

    #readme {
      margin-top: 16px;
    }

    #readme img {
      max-width: 100%;
    }

    #readme pre {
      overflow-x: auto;
    }

    #readme a {
      color: #0057d9;
    }

    #pdf-link {
      display: inline-block;
      padding: 12px 18px;
      background: #0057d9;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    iframe {
      width: 100%;
      height: 85vh;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="repo-name">Research Paper</h1>

    <div id="readme">Loading README...</div>

    <p>
      <a id="pdf-link" href="./paper.pdf">
        Read the Paper (PDF)
      </a>
    </p>
  </header>

  <iframe src="./paper.pdf" title="Research paper"></iframe>

  <script>
    const path = window.location.pathname
      .split("/")
      .filter(Boolean);

    const repoName = path[path.length - 1] || "Research Paper";

    document.title = repoName;
    document.getElementById("repo-name").textContent = repoName;

    const owner = "Fair-Snail";
    const repo = repoName;

    fetch(
      `https://api.github.com/repos/${owner}/${repo}/readme`,
      {
        headers: {
          Accept: "application/vnd.github.html+json"
        }
      }
    )
      .then(response => {
        if (!response.ok) {
          throw new Error("README could not be loaded.");
        }
        return response.text();
      })
      .then(html => {
        document.getElementById("readme").innerHTML = html;
      })
      .catch(() => {
        document.getElementById("readme").textContent =
          "README could not be loaded. You can still read the PDF below.";
      });
  </script>
</body>
</html>
